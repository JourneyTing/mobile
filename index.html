<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>신랑의 대모험 · 모바일 청첩장</title>
<!-- 카톡 링크 미리보기: 배포 후 og:image에 절대경로 이미지 URL 넣기 -->
<meta property="og:title" content="김신랑 ♥ 이신부 결혼합니다">
<meta property="og:description" content="신랑이 고난을 넘어 신부에게 가야 청첩장이 열립니다!">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root { --sky:#1d1b4b; --paper:#fff7ea; --ink:#2b2340; --pink:#e8567a; --sub:#7a6f8f; --gold:#ffd34d; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: 'Galmuri11', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .px { box-shadow: 0 -4px var(--ink), 0 4px var(--ink), -4px 0 var(--ink), 4px 0 var(--ink); }
  .btn { font: inherit; font-size: 14px; background: var(--pink); color: #fff; border: 0; padding: 10px 14px; cursor: pointer;
         box-shadow: inset -3px -3px rgba(0,0,0,.25), 0 -3px var(--ink), 0 3px var(--ink), -3px 0 var(--ink), 3px 0 var(--ink); }
  .btn:active { transform: translateY(2px); }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.sm { font-size: 12px; padding: 6px 10px; }

  /* ---------- 게임 ---------- */
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--sky);
          touch-action: none; user-select: none; -webkit-user-select: none; transition: opacity .4s; z-index: 10; }
  #game.out { opacity: 0; }
  #cv { display: block; image-rendering: pixelated; }
  #skip { position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); }
  #pick { position: absolute; left: 12px; top: calc(12px + env(safe-area-inset-top)); font: inherit; font-size: 12px; padding: 6px 8px;
          background: #fff; color: var(--ink); border: 0; border-radius: 0; box-shadow: 0 -3px var(--ink), 0 3px var(--ink), -3px 0 var(--ink), 3px 0 var(--ink); }
  /* 레트로 게임기 */
  #game.console { flex-direction: column; gap: 18px; background: #e4dcf4; }
  #game.console #cv { border: 12px solid #2b2340; border-radius: 8px 8px 28px 8px; box-sizing: content-box; }
  #pad { display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; width: min(320px, 90vw); row-gap: 10px; }
  #pad .brand { grid-column: 1 / -1; margin: 0; font-family: 'Galmuri9', monospace; font-size: 11px; letter-spacing: .3em; color: #8a7fb0; }
  .dpad { display: grid; grid-template: repeat(3, 40px) / repeat(3, 40px); }
  .dpad button, .dpad span { background: #2b2340; color: #e4dcf4; border: 0; font-size: 12px; padding: 0; }
  .dpad span { grid-area: 2 / 2; }
  .dpad [data-k=up] { grid-area: 1 / 2; border-radius: 4px 4px 0 0; } .dpad [data-k=down] { grid-area: 3 / 2; border-radius: 0 0 4px 4px; }
  .dpad [data-k=left] { grid-area: 2 / 1; border-radius: 4px 0 0 4px; } .dpad [data-k=right] { grid-area: 2 / 3; border-radius: 0 4px 4px 0; }
  .dpad button:active { background: #4a3f7a; }
  .ab { display: flex; gap: 14px; transform: rotate(-20deg); }
  .ab button { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--pink); color: #fff; font: inherit; font-size: 16px; box-shadow: 0 4px 0 #a33456; }
  .ab button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a33456; }
  #sound { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); }
  #open { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); font-size: 16px; padding: 14px 20px; animation: bob 1s steps(2) infinite; }
  @keyframes bob { 50% { margin-bottom: 4px; } }

  /* ---------- 청첩장 ---------- */
  #card { max-width: 440px; margin: 0 auto; min-height: 100vh; background: var(--paper); padding: 0 16px 48px; }
  .hero { margin: 0 -16px; padding: 48px 16px 40px; text-align: center; color: #fff;
          background: linear-gradient(#1d1b4b 0 30%, #2e2a6b 30% 50%, #55418c 50% 65%, #8c4f9e 65% 78%, #d0679b 78% 90%, #f59a8f 90%); }
  .hero canvas { width: 240px; image-rendering: pixelated; }
  .eyebrow { font-family: 'Galmuri9', 'Galmuri11', monospace; letter-spacing: .2em; font-size: 11px; color: var(--gold); margin: 16px 0 8px; }
  .hero h1 { font-size: 24px; margin: 0 0 16px; text-shadow: 2px 2px var(--ink); }
  .hero h1 span { color: var(--pink); }
  .hero p { margin: 6px 0; font-size: 14px; text-shadow: 1px 1px var(--ink); }
  .dday { display: inline-block; margin-top: 14px !important; background: var(--ink); padding: 6px 10px; color: var(--gold); }
  section.box { margin: 32px 4px; padding: 22px 16px; background: #fff; text-align: center; }
  h2 { font-size: 14px; color: var(--pink); letter-spacing: .15em; margin: 0 0 16px; }
  .msg { white-space: pre-line; line-height: 2; font-size: 14px; margin: 0 0 20px; }
  .parents { line-height: 2; font-size: 14px; margin: 0; }
  .parents b { font-size: 16px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 0; font-size: 13px; margin-top: 14px; }
  .cal b { font-weight: normal; color: var(--sub); font-size: 11px; }
  .cal .sun { color: var(--pink); } .cal .sat { color: #4a6fd0; }
  .cal .on { background: var(--pink); color: #fff; box-shadow: 0 -2px var(--ink), 0 2px var(--ink), -2px 0 var(--ink), 2px 0 var(--ink); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .addr { font-size: 13px; color: var(--sub); margin: 6px 0 0; }
  details { text-align: left; margin-top: 12px; }
  summary { cursor: pointer; padding: 10px; background: var(--paper); list-style: none; }
  summary::after { content: ' ▼'; float: right; font-size: 10px; }
  details[open] summary::after { content: ' ▲'; }
  .acc { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; border-bottom: 2px dashed #e6dccb; font-size: 13px; }
  .acc small { color: var(--sub); display: block; }
  footer { text-align: center; }
  .note { font-size: 12px; color: var(--sub); margin: 0 0 14px; }
  .gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .ph { aspect-ratio: 1; border: 0; padding: 0; overflow: hidden; cursor: pointer; background: #f1e6f0; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-empty { display: grid; place-items: center; font-size: 10px; color: var(--sub); cursor: default;
              background: repeating-linear-gradient(45deg, #fbe3ec 0 6px, #fff 6px 12px); }
  #lb { position: fixed; inset: 0; z-index: 30; background: rgba(20,18,50,.95); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; padding: 16px; touch-action: pan-y; }
  #lb img { max-width: 100%; max-height: 75vh; object-fit: contain; }
  .lbbar { display: flex; gap: 14px; align-items: center; color: #fff; font-size: 13px; }
  .tr { text-align: left; margin: 22px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 14px; font-size: 13px; }
  .tr dt { color: var(--pink); }
  .tr dd { margin: 0; white-space: pre-line; line-height: 1.7; }
  .ct h3 { font-size: 13px; color: var(--sub); text-align: left; margin: 14px 0 0; font-weight: normal; }
  .row.tight { margin: 0; gap: 8px; flex-wrap: nowrap; }
  .form { display: grid; gap: 10px; text-align: left; }
  .form input:not([type=radio]), .form textarea { font: inherit; font-size: 16px; width: 100%; padding: 10px; border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); }
  .form .fld { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .form .fld input { width: 80px; }
  .seg { display: flex; }
  .seg label { flex: 1; position: relative; }
  .seg input { position: absolute; opacity: 0; }
  .seg span { display: block; text-align: center; padding: 9px 4px; font-size: 13px; background: var(--paper); border: 2px solid var(--ink); margin-left: -2px; cursor: pointer; }
  .seg label:first-child span { margin-left: 0; }
  .seg input:checked + span { background: var(--pink); color: #fff; }
  .seg input:focus-visible + span, .form :focus-visible { outline: 2px dashed var(--pink); outline-offset: 2px; }
  .gb { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; display: grid; gap: 10px; }
  .gb li { background: var(--paper); padding: 10px 12px; font-size: 13px; }
  .gb time { float: right; font-size: 11px; color: var(--sub); }
  .gb p { margin: 6px 0 0; white-space: pre-line; line-height: 1.7; overflow-wrap: anywhere; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>

<div id="game">
  <canvas id="cv"></canvas>
  <select id="pick" hidden aria-label="버전 고르기"></select>
  <div id="pad" hidden>
    <p class="brand">WEDDING POCKET</p>
    <div class="dpad">
      <button data-k="up" aria-label="위">▲</button><button data-k="left" aria-label="왼쪽">◀</button><span></span>
      <button data-k="right" aria-label="오른쪽">▶</button><button data-k="down" aria-label="아래">▼</button>
    </div>
    <div class="ab"><button data-k="b" aria-label="B 뒤로">B</button><button data-k="a" aria-label="A 확인">A</button></div>
  </div>
  <button id="sound" class="btn ghost sm" aria-label="소리 켜기/끄기">♪ ON</button>
  <button id="skip" class="btn ghost sm">건너뛰기 ▶▶</button>
  <button id="open" class="btn" hidden>💌 청첩장 열기</button>
</div>

<main id="card" hidden></main>
<div id="toast"></div>
<div id="lb" hidden>
  <img id="lbImg" alt="">
  <div class="lbbar">
    <button id="lbPrev" class="btn ghost sm" aria-label="이전 사진">◀</button>
    <span id="lbCount"></span>
    <button id="lbNext" class="btn ghost sm" aria-label="다음 사진">▶</button>
    <button id="lbClose" class="btn sm">닫기</button>
  </div>
</div>

<script>
// ================== 여기만 수정하세요 ==================
const CONFIG = {
  groom: '김신랑', bride: '이신부',
  groomParents: '김아버지 · 박어머니', groomRel: '장남',
  brideParents: '이아버지 · 최어머니', brideRel: '장녀',
  date: '2027-05-15T12:30:00',
  venue: '규수당 문래',
  address: '서울특별시 강남구 테헤란로 123',
  message: `수많은 고난을 넘어
드디어 서로에게 도착했습니다.

저희의 새로운 시작을
가까이에서 축복해 주시면
더없는 기쁨으로 간직하겠습니다.`,
  accounts: {
    '신랑측': [ ['신랑 김신랑', '국민은행', '123-456-789012'], ['아버지 김아버지', '신한은행', '110-123-456789'] ],
    '신부측': [ ['신부 이신부', '카카오뱅크', '3333-01-2345678'], ['어머니 최어머니', '우리은행', '1002-123-456789'] ],
  },
  // 사진: index.html 옆에 photos 폴더를 만들고 넣기. 예: ['photos/1.jpg', 'photos/2.jpg']

  transport: [
    ['지하철', '2호선 강남역 3번 출구 도보 5분\n신분당선 강남역 4번 출구 도보 7분'],
    ['버스', '강남역 정류장 하차\n간선 140, 144 · 지선 3412'],
    ['자가용', '내비게이션에 "○○웨딩홀" 검색'],
    ['주차', '건물 지하주차장 2시간 무료\n안내데스크에서 주차권을 받아주세요'],
  ],
  contacts: {
    '신랑측': [ ['신랑', '김신랑', '010-1234-5678'], ['아버지', '김아버지', '010-0000-0000'], ['어머니', '박어머니', '010-0000-0000'] ],
    '신부측': [ ['신부', '이신부', '010-8765-4321'], ['아버지', '이아버지', '010-0000-0000'], ['어머니', '최어머니', '010-0000-0000'] ],
  },
  // 참석 여부·방명록을 저장할 구글 시트 주소 (apps-script.gs 맨 위 안내 참고). 비워두면 미리보기 모드
  sheetUrl: '',
  // 첫 화면 연출: 'run'(달리기) · 'climb'(오르기) · 'dodge'(피하기) · 'story'(대화형 스토리)
  //               'letter'(편지 봉투) · 'scratch'(스크래치 복권) · 'console'(레트로 게임기)
  // 'pick'이면 왼쪽 위에 고르는 메뉴가 보여요. 하나로 정한 뒤 바꾸면 메뉴가 사라집니다
  game: 'pick',
  // 대화형 스토리 대사: ['신랑' | '신부' | '둘', '대사']
  story: [
    ['신랑', '안녕하세요! 신랑입니다.'],
    ['신부', '안녕하세요, 신부예요.'],
    ['신랑', '저희는 ○○년 봄, 친구의 소개로 처음 만났어요.'],
    ['신부', '야근, 예산, 상견례... 고난도 많았지만'],
    ['신랑', '함께라서 하나씩 넘을 수 있었어요.'],
    ['둘', '그래서 저희, 결혼합니다!'],
    ['둘', '꼭 오셔서 축하해 주세요!'],
  ],
  // 게임 속 고난들 (x: 위치, w/h: 크기, t: 이름). 오르기·피하기 모드에서는 이름·크기·색만 씀
  course: [
    { x: 300,  w: 12, h: 14, c: '#f4f4f4', t: '야근' },
    { x: 460,  w: 14, h: 12, c: '#e43b44', t: '예산초과' },
    { x: 610,  w: 10, h: 20, c: '#ffd34d', t: '식장 예약전쟁' },
    { x: 760,  w: 18, h: 12, c: '#7ec8e3', t: '스드메' },
    { x: 900,  w: 12, h: 18, c: '#b388ff', t: '상견례' },
    { x: 1040, w: 12, h: 14, c: '#ff9f43', t: '청첩장 만들기' },
    { x: 1180, w: 20, h: 12, c: '#3fae5a', t: '다이어트' },
    { x: 1320, w: 12, h: 20, c: '#f4f4f4', t: '긴장감' },
  ],
};
// ======================================================

const PAL = { h:'#3b2417', s:'#f7c9a0', k:'#1c1c2b', w:'#ffffff', r:'#e43b44', b:'#6b4226', v:'#d8e4ff', p:'#ff6b9a', g:'#3fae5a' };
const BODY = ["...hhhh...","..hhhhhh..","..hhhhhh..","..hsssss..","..skssks..","..ssssss..","...ssss...","..kkwwkk..",".kkkrrkkk.",".kkkwwkkk.",".kkkwwkkk.",".skkwwkks.","..kkkkkk..","..kkkkkk.."];
const LEGS = {
  idle: ["..kk..kk..","..kk..kk..","..kk..kk..",".bbb..bbb."],
  run1: ["..kk.kk...","..kk..kk..",".kk...kk..",".bb....bb."],
  run2: ["...kkk....","...kkk....","...kkk....","...bbbb..."],
  jump: ["..kk.kk...","..kk..kk..","..kk..kk..","..bb...bb."],
};
const GH = BODY.length + 4; // 신랑 키 18 (신부 16)
const BRIDE = ["....hhhh....","...hhhhhhv..","...hsssshvv.","...skssksvv.","...psssspvv.","....ssss.vv.","...wwwwww.v.","..swwwwwws..","..s.wwww.s..","...pppwww...","...pgpwww...","...wwwwwww..","..wwwwwwwww.","..wwwwwwwww.",".wwwwwwwwwww",".wwwwwwwwwww"];
const HEART = [".pp.pp.","pwppppp","ppppppp",".ppppp.","..ppp..","...p..."];

function spr(c, rows, x, y, s = 1) {
  x = Math.round(x); y = Math.round(y);
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const p = row[i]; if (p !== '.') { c.fillStyle = PAL[p]; c.fillRect(x + i * s, y + j * s, s, s); } } });
}
function whenText() {
  const d = new Date(CONFIG.date), h = d.getHours(), mi = d.getMinutes();
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일 ${h < 12 ? '오전' : h < 17 ? '낮' : '저녁'} ${h % 12 || 12}시${mi ? ` ${mi}분` : ''}`;
}
const groomRows = legs => BODY.concat(LEGS[legs]);

// ---------- 게임 ----------
const W = 180, H = 320, GROUND = 250;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() {
  const dpr = devicePixelRatio || 1;
  const cons = $('game').classList.contains('console'); // 게임기 모드는 아래 버튼 자리를 남김
  const aw = cons ? Math.min(innerWidth - 56, 360) : innerWidth, ah = cons ? innerHeight - 250 : innerHeight;
  const S = Math.max(1, Math.floor(Math.min(aw / W, ah / H) * dpr));
  cv.width = W * S; cv.height = H * S;
  cv.style.width = W * S / dpr + 'px'; cv.style.height = H * S / dpr + 'px';
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

// 배경 테마 (모드마다 하나씩)
const THEMES = {
  sunset: { sky: ['#1d1b4b','#2e2a6b','#55418c','#8c4f9e','#d0679b','#f59a8f','#ffc58a'], stars: true, cloud: '#ffe3ef', land: 'city',
            ground: ['#3fae5a', '#2a7a3f', '#8a5a3c', '#6b4226'] },
  spring: { sky: ['#4fa9f0','#62b6f3','#78c2f5','#92cff7','#acdbf8','#c6e7fa','#e2f3fc'], stars: false, cloud: '#ffffff', land: 'hills',
            ground: ['#7bd35b', '#4aa04a', '#9a6a44', '#7a5032'] },
  night:  { sky: ['#0b0b24','#111236','#171a48','#1e2459','#262f6b','#2f3b7c','#3a488c'], stars: true, cloud: '#4a5a98', land: 'sea',
            ground: ['#f2d59a', '#d9b673', '#e8c98a', '#cfa968'] },
};
// 하늘은 테마마다 한 번만 그려둠 (밴드 + 디더링)
for (const th of Object.values(THEMES)) {
  const c = th.img = document.createElement('canvas'); c.width = W; c.height = GROUND;
  const s = c.getContext('2d'), bh = GROUND / th.sky.length;
  th.sky.forEach((col, i) => { s.fillStyle = col; s.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh)); });
  for (let i = 1; i < th.sky.length; i++) { s.fillStyle = th.sky[i]; const y = Math.floor(i * bh);
    for (let x = 0; x < W; x += 2) { s.fillRect(x, y - 2, 1, 1); s.fillRect(x + 1, y - 1, 1, 1); } }
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const STARS = Array.from({ length: 24 }, () => [rnd() * W | 0, rnd() * 90 | 0]);
const CITY = []; for (let x = 0; x < W + 40;) { const w = 14 + (rnd() * 12 | 0); CITY.push({ x, w, h: 30 + (rnd() * 45 | 0), lit: rnd() * 1000 | 0 }); x += w + 2; }
const CITY_W = CITY[CITY.length - 1].x + CITY[CITY.length - 1].w + 2;
const mod = (a, n) => ((a % n) + n) % n;

// sx: 가로 스크롤, oy: 세로로 올라간 만큼 (오르기 모드)
function drawBg(th, sx, oy) {

  // ===== 6. 스크래치 복권: 긁으면 날짜가 나오고 "당첨!" =====
  scratch: {
    name: '스크래치 복권', theme: THEMES.sunset, noTitle: true, noGroom: true, endText: '당첨!',
    AX: 26, AY: 150, AW: 128, AH: 50, // 긁는 영역 (2px 칸 64×25)
    reset() { this.cells = new Uint8Array(64 * 25); this.cleared = 0; this.done = false; this.wait = 0; this.lx = null; },
    rub(px, py) {
      const cx0 = Math.floor((px - this.AX) / 2), cy0 = Math.floor((py - this.AY) / 2);
      for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
        const cx = cx0 + dx, cy = cy0 + dy;
        if (dx * dx + dy * dy > 10 || cx < 0 || cy < 0 || cx >= 64 || cy >= 25) continue;
        const i = cy * 64 + cx; if (!this.cells[i]) { this.cells[i] = 1; this.cleared++; }

    },
    drag(x, y) { // 빠르게 긁어도 끊기지 않게 이전 점과 이어서 지움
      if (this.done) return;
      if (this.lx !== null) { const n = Math.max(1, Math.hypot(x - this.lx, y - this.ly) / 2); for (let k = 0; k <= n; k++) this.rub(this.lx + (x - this.lx) * k / n, this.ly + (y - this.ly) * k / n); }
      else this.rub(x, y);
      this.lx = x; this.ly = y;
      if (t % 4 === 0) beep(1500 + Math.random() * 500, 1200, .03, .015);
    },
    release() { this.lx = null; },
    step() {
      if (!this.done && this.cleared > this.cells.length * .5) { this.done = true; this.cells.fill(1); beep(784, 1568, .3); }
      return this.done && ++this.wait > 30;
    },
    draw() {

      ink(`${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`, W / 2, AY + 36, 10);
      for (let i = 0; i < this.cells.length; i++) if (!this.cells[i]) {
        const cx = i % 64, cy = i / 64 | 0;
        ctx.fillStyle = (cx + cy) % 7 ? '#b8bcc8' : '#d5d9e3'; ctx.fillRect(AX + cx * 2, AY + cy * 2, 2, 2);
      }
      if (this.cleared < 40) ink('여기를 긁어주세요', W / 2, AY + AH / 2, 10, '#5b5f6e');
      ink('1등 상품: 저희 결혼식 초대권', W / 2, 214, 9, '#7a6f8f', 'Galmuri9');
      if (!this.done && (t >> 5) % 2) txt('손가락으로 쓱쓱 긁어주세요!', W / 2, 256, 10, '#fff');
    },
  },

  // ===== 7. 레트로 게임기: 십자키로 메뉴를 골라 보기 =====
  console: {
    name: '레트로 게임기', theme: THEMES.spring, noTitle: true, console: true,

    reset() { this.cur = 0; this.page = null; gx = W / 2 - 13; fy = GROUND; bride = { x: W / 2 + 2, y: GROUND }; },
    key(k) {
      beep(700, 700, .04);
      if (this.page) { if (k === 'a' || k === 'b') this.page = null; return; }
      if (k === 'up') this.cur = (this.cur + this.menu.length - 1) % this.menu.length;
      if (k === 'down') this.cur = (this.cur + 1) % this.menu.length;

      if (this.cur === 3) begin(MODES.run); // 게임기 화면 안에서 달리기 게임
    },
    step() { legs = 'idle'; return false; },
    draw() {

// 모드 하나를 처음 상태로 (게임기 안에서 미니게임을 켤 때도 사용)
function begin(m) {
  mode = m;
  state = m.noTitle ? 'play' : 'title'; t = 0; playT = 0; endT = 0; meetT = -1; shake = 0; parts = []; inv = 0; hits = 0; got = 0;
  legs = 'idle'; bride = null; holdX = null; gx = W / 2 - 5; fy = GROUND;

// 소리
let AC, muted = false;
function beep(f1, f2, d, v = 0.05, delay = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
function march() { // 결혼행진곡(바그너, 퍼블릭 도메인) 첫 소절
  [[392,.35],[523,.25],[523,.12],[523,.6],[392,.35],[587,.25],[494,.12],[523,.6]]
    .reduce((at, [f, d]) => (beep(f, f, d * .95, .05, at), at + d), 0);
}

// 입력
function press() {
  if (state === 'title') { state = 'play'; if (!MODES[modeName].console) pick.hidden = true; beep(440, 880, .15); return false; }
  if (state === 'play' && mode.press) mode.press();
  return true;
}
function padKey(k) { // 게임기 버튼
  if (mode.key) return mode.key(k);
  if (k === 'b') return reset(); // 미니게임 중 B = 메뉴로
  if (k === 'a' || k === 'up') press();
}
const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
const toY = e => { const r = cv.getBoundingClientRect(); return (e.clientY - r.top) / r.height * H; };
$('game').addEventListener('pointerdown', e => {
  if (e.target.closest('button, select')) return;
  e.preventDefault();
  if (mode.key) return; // 게임기 메뉴는 버튼으로만
  if (press()) { holdX = toX(e); if (mode.drag) mode.drag(holdX, toY(e)); }
});
$('game').addEventListener('pointermove', e => { if (holdX !== null) { holdX = toX(e); if (mode.drag) mode.drag(holdX, toY(e)); } });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('game').addEventListener(ev, () => { holdX = null; if (mode.release) mode.release(); });
for (const b of document.querySelectorAll('#pad [data-k]')) b.addEventListener('pointerdown', e => { e.preventDefault(); padKey(b.dataset.k); });
addEventListener('keydown', e => {
  if ($('game').hidden || e.target.closest && e.target.closest('select')) return;
  if (MODES[modeName].console) {
    const k = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'a', Space: 'a', KeyZ: 'a', Escape: 'b', KeyX: 'b', Backspace: 'b' }[e.code];
    if (k) { e.preventDefault(); if (!e.repeat) padKey(k); }
    return;
  }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === 'ArrowLeft') keyDir = -1;
  if (e.code === 'ArrowRight') keyDir = 1;
});
addEventListener('keyup', e => { if ((e.code === 'ArrowLeft' && keyDir < 0) || (e.code === 'ArrowRight' && keyDir > 0)) keyDir = 0; });
$('sound').onclick = () => { muted = !muted; $('sound').textContent = muted ? '♪ OFF' : '♪ ON'; };
$('skip').onclick = openCard;
$('open').onclick = openCard;

function update() {
  t++;
  if (inv > 0) inv--;
  if (shake > 0) shake--;
  parts = parts.filter(p => (p.x += p.vx, p.y += p.vy, p.vy += .08, --p.life > 0));
  if (state === 'title') return;
  if (state === 'play') { playT++; if (mode.step()) { state = 'end'; $('skip').hidden = true; } return; }
  // 엔딩: 신부가 있으면 신랑이 옆으로 걸어감, 없으면 바로 축하
  endT++;
  if (mode.endStep) mode.endStep();
  const bx = bride ? bride.x : W / 2 - 6, by = bride ? bride.y : 150;
  const tx = gx < bx ? bx - 11 : bx + 13;
  if (meetT < 0 && bride && !mode.noGroom && Math.abs(gx - tx) > .8) { gx += Math.sign(tx - gx) * .8; legs = runLegs(); }
  else if (meetT < 0) { meetT = endT; legs = 'idle'; march(); burst(bx + 6, by - 20, 40, ['#ff6b9a', '#ffd34d', '#fff', '#7ec8e3']); }
  if (meetT >= 0 && endT - meetT === 100) $('open').hidden = false;
  if (meetT >= 0 && endT % 40 === 0) burst(bx + 2, by - 22, 6, ['#ff6b9a', '#fff']);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() * 3 | 0) - 1, (Math.random() * 3 | 0) - 1);
  if (state === 'title') drawBg(mode.theme, t * .5, 0); else mode.draw();
  if (bride && !(state === 'title' && mode.game)) spr(ctx, BRIDE, bride.x, bride.y - 16);
  if (!mode.noGroom && !(inv > 0 && t % 6 < 3)) spr(ctx, groomRows(legs), gx, fy - GH);
  for (const p of parts) { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }

  if (state === 'title') {
    const [a, b] = mode.title || [`신랑 ${CONFIG.groom.slice(1)}의`, '대모험'];
    txt(a, W / 2, 70, 12, '#ffd34d');
    txt(b, W / 2, 94, 22, '#fff');
    txt(mode.sub, W / 2, 124, 10, '#ffe3ef');
    if ((t >> 5) % 2) txt('화면을 톡! 눌러 시작', W / 2, 180, 11, '#fff');
    txt(mode.hint, W / 2, H - 40, 10, '#ffe3ef');
  } else if (mode.game) {
    ctx.fillStyle = '#1c1c2b'; ctx.fillRect(19, 13, 132, 6);
    ctx.fillStyle = '#ff6b9a'; ctx.fillRect(20, 14, 130 * clamp(mode.progress(), 0, 1), 4);
    spr(ctx, HEART, 152, 13);
    txt(`♥ ${got}/${mode.hearts.length}`, 24, 30, 9, '#fff', 'Galmuri9');
    if (state === 'play' && playT < 180) txt(mode.tip, W / 2, H - 40, 10, '#ffe3ef');
  }
  if (meetT >= 0 && mode.endText !== null) {
    txt(mode.endText || '드디어 만났다!', W / 2, 52, 16, '#ffd34d');
    if (mode.game) {
      txt(`하트 ${got}개 · 꽈당 ${hits}번`, W / 2, 74, 10, '#fff');
      if (got === mode.hearts.length && hits === 0) txt('★ 퍼펙트 신랑 ★', W / 2, 90, 10, '#ff6b9a');
    }
  }
  ctx.restore();
}

let last = 0, acc = 0;
function loop(ts) {
  if (!running) return;
  acc += Math.min(100, ts - (last || ts)); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } // 고주사율 폰에서도 같은 속도
  draw();
  requestAnimationFrame(loop);
}
function startGame() { reset(); running = true; last = 0; acc = 0; requestAnimationFrame(loop); }

function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
function copy(s, msg = '복사되었습니다') {
  if (navigator.clipboard && isSecureContext) return navigator.clipboard.writeText(s).then(() => toast(msg), () => toast('복사 실패'));
  const ta = Object.assign(document.createElement('textarea'), { value: s }); document.body.append(ta); ta.select();
  document.execCommand('copy'); ta.remove(); toast(msg);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy);
  const p = e.target.closest('.ph[data-i]'); if (p) lbShow(+p.dataset.i);
});

// 사진 크게 보기 (좌우 스와이프)
let lbI = 0, lbX = 0;
function lbShow(i) {
  const P = CONFIG.photos; lbI = (i + P.length) % P.length;
  $('lbImg').src = P[lbI]; $('lbImg').alt = `웨딩 사진 ${lbI + 1}`; $('lbCount').textContent = `${lbI + 1} / ${P.length}`; $('lb').hidden = false;
}
$('lbPrev').onclick = () => lbShow(lbI - 1);
$('lbNext').onclick = () => lbShow(lbI + 1);
$('lbClose').onclick = () => { $('lb').hidden = true; };
$('lb').addEventListener('pointerdown', e => { lbX = e.clientX; });
$('lb').addEventListener('pointerup', e => { const dx = e.clientX - lbX; if (Math.abs(dx) > 40) lbShow(lbI + (dx < 0 ? 1 : -1)); });
addEventListener('keydown', e => { if ($('lb').hidden) return; if (e.key === 'Escape') $('lb').hidden = true; if (e.key === 'ArrowLeft') lbShow(lbI - 1); if (e.key === 'ArrowRight') lbShow(lbI + 1); });

// 참석 여부·방명록: 구글 시트(Apps Script)로 전송. sheetUrl이 없으면 미리보기 모드(방명록만 이 기기에 저장)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = 'wedding-guestbook';
function lsGet() { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (e) { return []; } }
function lsSet(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} }

async function submit(e, local, okMsg, after) {
  e.preventDefault();
  const form = e.target, btn = form.querySelector('button:last-child');
  const d = Object.fromEntries(new FormData(form));
  btn.disabled = true;
  try {
    local(d);
    // ponytail: no-cors라 응답을 읽을 수 없음 → 네트워크 오류만 실패로 처리. 시트에서 실제 기록을 확인하세요
    if (CONFIG.sheetUrl) await fetch(CONFIG.sheetUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ type: form.id, ...d }) });
    toast(CONFIG.sheetUrl || form.id === 'gb' ? okMsg : '미리보기 모드라 저장되지 않았어요');
    form.reset();
    if (after) await after();
  } catch (err) { toast('전송하지 못했어요. 잠시 후 다시 시도해주세요'); }
  btn.disabled = false;
}

async function loadGb() {
  let list = lsGet();
  if (CONFIG.sheetUrl) {
    try { list = await (await fetch(CONFIG.sheetUrl)).json(); }
    catch (e) { $('gbList').innerHTML = '<li class="note">방명록을 불러오지 못했어요</li>'; return; }
  }
  $('gbList').innerHTML = list.length
    ? list.map(g => `<li><b>${esc(g.name)}</b><time>${new Date(g.t).toLocaleDateString('ko-KR')}</time><p>${esc(g.msg)}</p></li>`).join('')
    : '<li class="note">첫 축하 메시지를 남겨주세요!</li>';
}

renderCard();
startGame();
</script>
